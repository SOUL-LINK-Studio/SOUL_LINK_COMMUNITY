
name: SOUL LINK - Discord announcements

on:
  workflow_dispatch:
  discussion:
    types: [created]
  release:
    types: [published]

permissions:
  contents: read
  discussions: read

jobs:
  announce:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Discord message
        id: message
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_URL: ${{ github.event.discussion.html_url }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MESSAGE="🧪 Test de connexion réussi !
          SOUL LINK est connecté à Discord."
          elif [ "$EVENT_NAME" = "discussion" ]; then
            MESSAGE="💬 Nouvelle discussion SOUL LINK !
          ${DISCUSSION_TITLE}
          ${DISCUSSION_URL}"
          else
            MESSAGE="🚀 Nouvelle version de SOUL LINK !
          ${RELEASE_NAME:-$RELEASE_TAG}
          ${RELEASE_URL}"
          fi

          {
            echo "content<<EOF"
            echo "$MESSAGE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send message to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MESSAGE: ${{ steps.message.outputs.content }}
        run: |
          jq -n --arg content "$MESSAGE" \
            '{content: $content}' |
            curl --fail --silent --show-error \
              -H "Content-Type: application/json" \
              -d @- \
              "$WEBHOOK_URL"
